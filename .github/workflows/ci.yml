name: CI

# The Grow Mentions publication circuit (.search-loop/config.json) requires build, content-scope, seo and render
# to succeed on the exact commit it publishes. preview uploads that commit to its own address; deploy ships main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  content-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-scope.mjs
        env:
          SEARCH_LOOP_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-seo.mjs

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/check-render.mjs

  # Uploads the tested commit as a Worker version (not deployed) with the alias p<sha8>. Preview responses carry
  # X-Robots-Tag: noindex through _headers, so the HTML stays byte-identical to what production will serve.
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [build, content-scope, seo, render]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Mark the preview noindex
        run: |
          printf '/*\n  X-Robots-Tag: noindex\n' > dist/_headers
      - name: Upload preview version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Secret CLOUDFLARE_API_TOKEN is not set; no preview was uploaded."; exit 1; fi
          ALIAS="p${HEAD_SHA:0:8}"
          pnpm exec wrangler versions upload --preview-alias "$ALIAS" --message "PR #${{ github.event.pull_request.number }} ${HEAD_SHA}"
          echo "Preview: https://${ALIAS}-geteventfacefinder-site.matheo-rbt-pro-cloudfaire.workers.dev" >> "$GITHUB_STEP_SUMMARY"
      # Reports the preview as a GitHub deployment of the tested commit, which Grow Mentions' "Lire le dépôt" reads.
      - name: Record GitHub deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="https://p${HEAD_SHA:0:8}-geteventfacefinder-site.matheo-rbt-pro-cloudfaire.workers.dev"
          ID=$(printf '{"ref":"%s","environment":"preview","auto_merge":false,"required_contexts":[],"transient_environment":true,"production_environment":false}' "$HEAD_SHA" \
            | gh api "repos/${GITHUB_REPOSITORY}/deployments" --input - -q .id)
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${ID}/statuses" -f state=success -f environment_url="$URL" -f log_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, content-scope, seo, render]
    runs-on: ubuntu-latest
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Secret CLOUDFLARE_API_TOKEN is not set; production was not deployed."; exit 1; fi
          pnpm exec wrangler deploy --message "main ${GITHUB_SHA}"
